[project]
name = "loomy-api"
version = "0.0.1"
description = "Loomy API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "python-dotenv",
    "pydantic-settings",
    "python-jose[cryptography]",
    "bcrypt",
    "email-validator",
    "httpx",
    "redis",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "types-python-jose",
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py312"